set_output_hdcp:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mtviki_matrix
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mtviki_matrix
    output:
      required: true
      example: 1
