          mode: box

locate:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mtviki_matrix
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mtviki_matrix
    count:
      required: false
      default: 4
      selector:
        number:
          min: 1
          max: 20
          mode: box
    interval:
      required: false
      default: 0.35
      selector:
        number:
          min: 0.1
          max: 2.0
          step: 0.05
          unit_of_measurement: s
          mode: box
