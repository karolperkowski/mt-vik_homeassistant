set_input_edid:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mtviki_matrix
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mtviki_matrix
    input:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    edid:
      required: true
      example: 1
      selector:
        number:
          min: 1
