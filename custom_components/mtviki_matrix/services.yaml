set_route:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mtviki_matrix
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mtviki_matrix
    input:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box
    outputs:
      required: true
      example: "[1, 3] or 'all'"
      selector:
        object:

save_scene:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mtviki_matrix
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mtviki_matrix
    scene:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 16
          mode: box

recall_scene:
  fields:
    device_id:
      required: false
      selector:
        device:
          integration: mtviki_matrix
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: mtviki_matrix
    scene:
      required: true
      example: 1
