[pytest]
# Owned by the test suite (AGENT-C). pytest.ini takes precedence over any
# pyproject.toml [tool.pytest.ini_options] block, so this is the single source
# of truth for how the suite runs.
testpaths = tests
# Makes `custom_components.mtviki_matrix...` importable without installing.
pythonpath = .
# pytest-asyncio: every `async def test_*` is collected without a marker.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -p no:cacheprovider
    --strict-markers
    --durations=10
markers =
    hardware: tests that require a physical MT-VIKI matrix (never run in CI)
filterwarnings =
    ignore::DeprecationWarning:asyncio
